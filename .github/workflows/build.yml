name: Build and package

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test release validation
        run: python3 -m unittest discover -s Tests -p 'test_*.py' -v
      - name: Test core calculations
        run: swift test
      - name: Build local test packages
        run: python3 scripts/release.py build --mode local --version 0.1.0 --build-number "$GITHUB_RUN_NUMBER"
      - name: Verify packaged applications
        run: python3 scripts/release.py verify --artifacts dist/0.1.0-arm64-local
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MacStatus-local-test-arm64
          path: dist/0.1.0-arm64-local/*
          if-no-files-found: error
          retention-days: 14
